name: Deploy Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile --os=linux --cpu=x64

      - name: Build static site
        run: |
          bun run build
          node -e "const fs = require('node:fs'); const assert = require('node:assert/strict'); assert.deepEqual(fs.readdirSync('dist', { recursive: true }).filter(f => f.endsWith('.html')), ['index.html']); assert.ok(!fs.existsSync('dist/server'));"

      - name: Deploy to Cloudflare Pages
        # Pages project production_branch is "main"; without it, master deploys land in Preview.
        run: bunx wrangler pages deploy dist --project-name=dukerspace --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
